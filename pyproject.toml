[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gemsdoe50"
version = "0.1.0"
description = "Auditable research tools for the DOE GEMS Prize fault-mapping challenge"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "GEMSDOE50 research project" }]
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.11,<2",
  "rasterio>=1.3,<2",
  "pyproj>=3.6,<4",
  "pyshp>=2.3,<4",
  "scikit-image>=0.22,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = [".", "src"]

[tool.ruff]
line-length = 100
target-version = "py310"
