name: tests

on:
  push:
    branches: [main, 'arena/**']
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy scipy scikit-image rasterio pyproj pandas scikit-learn tifffile Pillow pytest
      - run: python3 -m pytest tests/ -q
