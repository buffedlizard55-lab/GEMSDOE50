name: tests

on:
  push:
    branches: [main, 'arena/**']
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install the repository package and test dependencies
        run: python -m pip install -e '.[test]'
      - name: Run the complete repository suite
        run: python -m pytest tests/ -q
