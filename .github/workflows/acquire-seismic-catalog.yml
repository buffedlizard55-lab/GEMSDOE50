name: acquire-pinned-seismic-catalog

on:
  push:
    branches: ['arena/38c5cc42-gemsdoe50']
    paths:
      - '.github/workflows/acquire-seismic-catalog.yml'
      - 'scripts/download_inputs.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Download the public CC BY 4.0 Nevada relocated catalog
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p catalog
          curl --fail --location --retry 3 --retry-all-errors --connect-timeout 30 \
            'https://zenodo.org/api/records/11167510/files/nvreloc_catalog_newmag.txt/content' \
            -o catalog/nvreloc_catalog_newmag.txt
          test "$(wc -c < catalog/nvreloc_catalog_newmag.txt | tr -d ' ')" = '13833354'
          echo '38fa663f473378b61c74b597c53c416b  catalog/nvreloc_catalog_newmag.txt' \
            | md5sum --check
          sha256sum catalog/nvreloc_catalog_newmag.txt > catalog/SHA256SUMS
          curl --fail --location --retry 3 --retry-all-errors --connect-timeout 30 \
            'https://zenodo.org/api/records/11167510' -o catalog/zenodo-record-11167510.json
          python - <<'PY'
          import json
          from pathlib import Path

          record = json.loads(Path('catalog/zenodo-record-11167510.json').read_text())
          metadata = record.get('metadata', {})
          license_meta = metadata.get('license', {})
          rights = str(
              license_meta.get('id', '') if isinstance(license_meta, dict) else license_meta
          ).lower()
          if rights != 'cc-by-4.0':
              raise SystemExit(f'unexpected Zenodo license id: {rights!r}')
          files = {f['key']: f for f in record.get('files', [])}
          row = files.get('nvreloc_catalog_newmag.txt')
          if not row:
              raise SystemExit('catalog file absent from Zenodo record')
          if int(row['size']) != 13_833_354:
              raise SystemExit(f"unexpected API file size: {row['size']}")
          receipt = {
              'record_url': 'https://zenodo.org/records/11167510',
              'record_api': 'https://zenodo.org/api/records/11167510',
              'doi': metadata.get('doi'),
              'title': metadata.get('title'),
              'license_id': rights,
              'file': row,
              'changes': 'None; downloaded bytes are uploaded as a transient workflow artifact.',
          }
          Path('catalog/acquisition-receipt.json').write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + '\n'
          )
          PY

      - name: Upload verified transient research input
        uses: actions/upload-artifact@v4
        with:
          name: nvreloc-catalog-11167510
          path: catalog/
          if-no-files-found: error
          retention-days: 3
